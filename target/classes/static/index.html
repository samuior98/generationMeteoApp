<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: var(--bg);
            color: var(--text);
            padding: 40px;
            transition: background 0.3s, color 0.3s;
        }

        :root {
            --bg: #f0f4f8;
            --text: #333;
            --card-bg: #fff;
            --day-bg: linear-gradient(135deg, #e0f7fa, #fff);
        }

        .dark-theme {
            --bg: #1e1e1e;
            --text: #eee;
            --card-bg: #2b2b2b;
            --day-bg: linear-gradient(135deg, #333, #444);
        }

        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            margin: 20px auto;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: grid;
            gap: 15px;
        }

        .days-container {
            display: grid;
            gap: 15px;
        }

        @media(min-width: 600px){
            .days-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .day {
            background: var(--day-bg);
            padding: 15px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }

        .day:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .weather-icon img {
            width: 50px;
            height: 50px;
        }

        .description {
            font-weight: bold;
            font-size: 18px;
            margin: 5px 0;
        }

        .temperature {
            margin-top: 5px;
            font-size: 16px;
        }

        .temp-max {
            color: #e74c3c;
            font-weight: bold;
        }

        .temp-min {
            color: #3498db;
            font-weight: bold;
        }

        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            white-space: nowrap;
        }

        .day:hover .tooltip {
            display: block;
        }

        #loader {
            font-size: 18px;
            margin: 20px 0;
        }

        #theme-toggle {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            cursor: pointer;

            background: transparent;
            border: 1px solid var(--text); /* Bordo dinamico che cambia colore col tema */
            color: var(--text);
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            display: flex; /* Centra l'icona e il testo */
            align-items: center;
            gap: 5px; /* Spazio tra icona e testo */
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background-color: rgba(128, 128, 128, 0.1);
            transform: scale(1.05);
        }

        datalist option {
            padding: 5px;
        }

        button:active {
            transform: scale(0.95);
        }

        input#city, button#cerca {
            border: 2px solid #ddd;
            border-radius: 25px;
            padding-left: 20px;
            padding-right: 20px;
            outline: none;
            transition: border-color 0.3s;
        }

        input#city:focus {
            border-color: #3498db;
        }
    </style>
</head>
<body>

    <h1>Weather App</h1>
    <button id="theme-toggle" onclick="toggleTheme()">🌙</button>

    <input id="city" list="cities" placeholder="Inserisci città">
    <datalist id="cities">
        <option value="Roma">
        <option value="Milano">
        <option value="Napoli">
        <option value="Torino">
        <option value="Firenze">
        <option value="Bologna">
        <option value="Venezia">
    </datalist>
    <button id="cerca" onclick="getWeather()">🔎 Cerca</button>

    <div id="loader" style="display:none;">⏳ Caricamento...</div>
    <div id="result"></div>

    <script>
        let darkMode = false;

        function toggleTheme(){
            darkMode = !darkMode;
            const body = document.body;
            const themeToggleBtn = document.getElementById("theme-toggle"); // <--- AGGIUNTO

            body.classList.toggle('dark-theme', darkMode);

            if (darkMode) {
                themeToggleBtn.innerHTML = "☀️";
            } else {
                // Se il tema CHIARO è attivo, mostriamo la LUNA per passare allo SCURO
                themeToggleBtn.innerHTML = "🌙";
            }
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString("it-IT", {
                weekday: "long",
                day: "numeric",
                month: "long"
            });
        }

        async function getWeather() {
            const city = document.getElementById("city").value;
            if(!city) return;
            if(!city.trim()) {
                alert("Per favore, inserisci il nome di una città.");
                return;
            }

            document.getElementById("loader").style.display = "block";
            document.getElementById("result").innerHTML = "";

            try {
                const res = await fetch(`/api/weather?city=${city}`);
                if(!res.ok) throw new Error("Città non trovata");
                const data = await res.json();
                const daily = data.daily;

                let html = `<div class="card"><h2>${city}</h2><div class="days-container">`;

                for (let i = 0; i < daily.time.length; i++) {
                    const date = formatDate(daily.time[i]);
                    const iconCode = daily.weatherIcon[i];
                    const desc = daily.weatherDescription[i];
                    const tempMax = daily.temperature_2m_max[i];
                    const tempMin = daily.temperature_2m_min[i];
                    const wind = daily.wind_speed_10m_max[i] ?? "N/A";
                    const humidity = daily.relative_humidity_2m_max[i] ?? "N/A";

                    html += `
                        <div class="day">
                            <div><strong>${date}</strong></div>
                            <div class="weather-icon">
                                <img src="https://openweathermap.org/img/wn/${iconCode}@2x.png" alt="${desc}">
                            </div>
                            <div class="description">${desc}</div>
                            <div class="temperature" title="Vento: ${wind} km/h, Umidità: ${humidity}%">
                                🌡️ Max: <span class="temp-max">${tempMax}°C</span> | 
                                Min: <span class="temp-min">${tempMin}°C</span>
                            </div>
                            <div class="tooltip">Vento: ${wind} km/h, Umidità: ${humidity}%</div>
                        </div>
                    `;
                }

                html += `</div></div>`;
                document.getElementById("result").innerHTML = html;
            } catch(err) {
                document.getElementById("result").innerHTML = `<div class="card">❌ ${err.message}</div>`;
            } finally {
                document.getElementById("loader").style.display = "none";
            }
        }
    </script>

</body>
</html>
